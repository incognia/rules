name: Link check

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 06:00 CST (UTC-6)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
